services:
  db:
    image: postgres:16-alpine
    container_name: clinic_postgres_db
    restart: always
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./database/init_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./database/init_data.sql:/docker-entrypoint-initdb.d/02_data.sql:ro
      - ./database/init_roles.sh:/docker-entrypoint-initdb.d/03_roles.sh:ro
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${DB_PORT}:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${DB_NAME}" ]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - clinic-net

  patient-ui:
    build: .
    container_name: clinic_patient_ui
    restart: always
    command: streamlit run src/patient_app.py --server.port 8501 --server.address 0.0.0.0
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: 5432
      OLLAMA_HOST: http://host.docker.internal:11434
    ports:
      - "8501:8501"
    depends_on:
      db:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - clinic-net

  doctor-ui:
    build: .
    container_name: clinic_doctor_ui
    restart: always
    command: streamlit run src/doctor_app.py --server.port 8502 --server.address 0.0.0.0
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: 5432
    ports:
      - "8502:8502"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - clinic-net

  tests:
    build: .
    container_name: clinic_tests
    profiles: [ "test" ]
    command: python -m pytest tests -v
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: 5432
      # проверяемая роль бота (из .env: DB_USER/DB_PASSWORD)
      # админ для сидинга/очистки тестовых данных:
      DB_ADMIN_USER: ${POSTGRES_USER}
      DB_ADMIN_PASSWORD: ${POSTGRES_PASSWORD}
      # роль регистратора для тестов пути врача:
      REGISTRAR_USER: registrar
      REGISTRAR_PASSWORD: ${REGISTRAR_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - clinic-net

networks:
  clinic-net:
    driver: bridge

volumes:
  pgdata: